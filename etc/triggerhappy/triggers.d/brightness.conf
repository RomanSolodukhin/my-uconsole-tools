# uConsole console-mode brightness keys -> ucon-brightness (floor-protected)
# format: <key>  <value: 1=press 2=autorepeat>  <command>
KEY_BRIGHTNESSUP	1	/usr/local/bin/ucon-brightness up
KEY_BRIGHTNESSUP	2	/usr/local/bin/ucon-brightness up
KEY_BRIGHTNESSDOWN	1	/usr/local/bin/ucon-brightness down
KEY_BRIGHTNESSDOWN	2	/usr/local/bin/ucon-brightness down
