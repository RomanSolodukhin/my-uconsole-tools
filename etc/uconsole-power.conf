# uConsole power/economy tuning.
# Эффекты эконома (dim/governor) — только когда economy ON и на батарее.
# Авто-выключение — на батарее в обоих режимах (разные пороги). На зарядке не гасит.
# ВАЖНО: комментарии на отдельных строках (inline '#' без пробела ломает source).

# --- Phase 1: economy core ---
# сек простоя -> яркость до DIM_LEVEL (только эко)
IDLE_DIM=90
# яркость на простое (не ниже 1)
DIM_LEVEL=1
# governor в эконом-режиме (на батарее), постоянно
CPU_GOVERNOR=powersave
# governor вне эконома
NORMAL_GOVERNOR=ondemand
# период опроса демона, сек
TICK=5

# --- Phase 3: auto-shutdown + network gate ---
# сек простоя (эко) -> кандидат на выключение (0 = выключить меру)
SHUTDOWN_IDLE_ECO=600
# сек простоя (обычный режим) -> кандидат (0 = выключить меру)
SHUTDOWN_IDLE_NORMAL=900
# % (эко): простой + заряд ниже -> гасить даже при сетевой активности
SHUTDOWN_BATT_OVERRIDE=50
# % (эко): немедленно гасить (после сохранения сессии)
BATT_CRITICAL=5
# байт/с интерфейса маршрута по умолчанию выше -> сеть считается активной
NET_RATE=20480
# сек тишины сети -> "нет сетевой активности"
NET_QUIET=120
# сек предупреждения перед выключением (отмена любым вводом)
SHUTDOWN_WARN=60
# подтверждать power-save wifi-чипа на батарее
# звук при старте обратного отсчёта (пусто = выключить)
WARN_SOUND=/usr/local/share/uconsole/shutdown-warn.wav
# нарастающий сигнал: за WARN_LOUD_AT сек до выключения — громче (один раз),
# за WARN_URGENT_AT сек — максимально громко и повтор каждый тик до конца.
# Громкость поднимается через громкость sink PipeWire (wav уже на максимуме),
# по завершении/отмене предупреждения sink возвращается на прежний уровень.
WARN_LOUD_AT=30
WARN_URGENT_AT=10
WARN_VOL_LOUD=0.75
WARN_VOL_URGENT=1.0
WIFI_PS=on
# 1 = только лог "DRY would poweroff" (обкатка), 0 = реально выключать
DRY_RUN=0
