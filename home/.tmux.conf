set -g status on
set -g status-interval 10
set -g status-left '#H '
set -g status-right-length 100
set -g status-right '#(~/.local/bin/eco-status)#(~/.local/bin/volume-status)#(~/.local/bin/tmux-system-status)▒#(~/.local/bin/battery-status)▒#(~/.local/bin/kbd-status)▒#(TZ=Europe/Nicosia date +%H:%M) '
# Replay the Wi-Fi SSID marquee once when a session starts (e.g. after reboot)
set-hook -g session-created 'run-shell -b "~/.local/bin/net-marquee-trigger"'
set -g mouse on
set -g history-limit 50000

# prefix + e -> toggle economy mode (runs as the user; shows ECONOMY ON/OFF marquee)
bind-key e run-shell -b '~/.local/bin/uconsole-eco toggle'

# Audio control. Alt+letters are reliable on the Linux console; arrows and +/-
# are kept as extra bindings for terminals that pass them cleanly.
bind-key -n M-k run-shell -b '~/.local/bin/volume-control up'
bind-key -n M-j run-shell -b '~/.local/bin/volume-control down'
bind-key -n M-m run-shell -b '~/.local/bin/volume-control toggle'
bind-key -n M-Up run-shell -b '~/.local/bin/volume-control up'
bind-key -n M-Down run-shell -b '~/.local/bin/volume-control down'
bind-key k run-shell -b '~/.local/bin/volume-control up'
bind-key j run-shell -b '~/.local/bin/volume-control down'
bind-key m run-shell -b '~/.local/bin/volume-control toggle'
bind-key = run-shell -b '~/.local/bin/volume-control up'
bind-key - run-shell -b '~/.local/bin/volume-control down'

# --- Session save/restore (tmux-resurrect; periodic save via systemd timer, no continuum) ---
set -g @resurrect-capture-pane-contents 'on'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux

# prefix + g -> new window as the corporate user (r.solodukhin), own HOME/claude/ssh
bind-key g new-window -n work "sudo -iu r.solodukhin"
